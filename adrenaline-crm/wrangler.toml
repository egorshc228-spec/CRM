name = "adrenaline-crm"
compatibility_date = "2024-09-23"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "adrenaline-crm"
# После `npx wrangler d1 create adrenaline-crm` вставьте сюда database_id из ответа
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Несекретные переменные. Секреты (TG_BOT_TOKEN, SESSION_SECRET, AGENT_API_KEY, INTAKE_KEY)
# задаются в Cloudflare → Pages → adrenaline-crm → Settings → Variables and Secrets.
[vars]
TG_BOT_USERNAME = ""
OWNER_TG_ID = ""
CRM_URL = ""
TG_NOTIFY_CHAT_ID = ""
# Короткое имя мини-приложения из @BotFather (/newapp), например "crm". Пусто — ссылки ведут на сайт.
TG_APP_SHORTNAME = ""
